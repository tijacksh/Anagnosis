# Déploiement de anagnosis.fr — la vitrine, et le contenu signé que les apps
# téléchargent (docs/passation-audio.md).
#
# Netlify reconstruit le site à chaque push : `npm run site` assemble
# export/site/ à partir des fiches validées du dépôt. Rien n'est committé : ce
# qui est en ligne est toujours le reflet exact du contenu validé sur main.
#
# Le dépôt n'a aucune dépendance runtime : l'installation est un no-op et la
# construction tient en quelques secondes.

[build]
  command = "npm run site"
  publish = "export/site"

[build.environment]
  NODE_VERSION = "20"

# URL propres : /contact plutôt que /contact.html. Explicite plutôt que de
# compter sur le comportement par défaut de Netlify, qui peut changer.
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 200

[[redirects]]
  from = "/conditions"
  to = "/conditions.html"
  status = 200

# La vitrine est une page publique, contrairement à l'ancien banc d'essai :
# elle doit être indexée.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # `frame-ancestors 'none'` : rien n'a de raison d'encadrer la vitrine dans une
    # page tierce. `script-src 'unsafe-inline'` reste nécessaire au seul script en
    # ligne de la page d'accueil, l'ouverture animée des familles de disciplines
    # (`site/index.html`) ; `style-src 'unsafe-inline'` aux styles portés par les
    # puces de discipline, dont la couleur vient du corpus et ne peut donc pas être
    # une classe CSS statique.
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'"
