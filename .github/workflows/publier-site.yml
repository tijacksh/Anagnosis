# Construit la vitrine et le contenu signé, puis les publie sur Cloudflare (Worker `anagnosis-site`,
# fichiers statiques gratuits et sans plafond de déploiements).
#
# Remplace Netlify : il facturait 15 crédits par déploiement et, avec les routines de contenu qui
# poussent des dizaines de fois par jour, le plan a été épuisé en neuf jours (2026-10-09), ce qui
# a figé le site et le flux lu par les apps (docs/decisions.md, 2026-10-11).
#
# Secrets du dépôt (Settings > Secrets and variables > Actions) :
#   ANAGNOSIS_CLE_PRIVEE   clé privée Ed25519 qui signe concepts.json (la même que celle posée chez Netlify)
#   CLOUDFLARE_API_TOKEN   jeton Cloudflare (Workers Scripts : Edit, D1 : Edit)
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
name: Publier le site

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'site/**'
      - 'src/**'
      - 'worker/site.js'
      - 'worker/debit.js'
      - 'worker/wrangler-site.toml'
      - '.github/workflows/publier-site.yml'
  schedule:
    - cron: '23 */4 * * *'   # filet : une publication toutes les 4 heures, même sans poussée
  workflow_dispatch:

# Une publication à la fois ; une plus récente remplace celle qui attend.
concurrency:
  group: publier-site
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Construire la vitrine et signer le contenu
        env:
          ANAGNOSIS_CLE_PRIVEE: ${{ secrets.ANAGNOSIS_CLE_PRIVEE }}
        run: npm run site
      - name: Refuser de publier un site sans contenu signé
        run: |
          test -s export/site/contenu/concepts.json
          test -s export/site/contenu/concepts.json.sig
          test -s export/site/index.html
      - name: Publier sur Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config worker/wrangler-site.toml
