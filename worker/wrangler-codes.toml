name = "anagnosis-codes"
main = "codes.js"
compatibility_date = "2026-08-27"

[[d1_databases]]
binding = "DB"
database_name = "anagnosis-codes"
database_id = "e5ba6cae-8281-4980-891e-00f401defce0"

# La limite de débit vit dans la table `debit` de cette même base D1 (voir
# `debit.schema.sql`, `debit.js`), pas dans le binding `Rate Limit` natif : celui-ci,
# malgré une configuration conforme à la documentation, laissait passer toute charge
# testée en direct (`wrangler tail`, quinze requêtes en cinq secondes sans jamais
# refuser). Le binding est retiré plutôt que laissé mort dans le fichier.

# Deux secrets, posés avec `npx wrangler secret put <NOM> --config wrangler-codes.toml`
# et vivant ensuite côté Cloudflare, jamais dans ce dépôt :
#   CLE_PARTAGEE   — même valeur que celui d'audio.js (ANAGNOSIS_CLE_AUDIO_PARTAGEE
#                    dans ~/.anagnosis/cles.env). Distingue une requête de l'app d'un
#                    scan anonyme, rien de plus.
#   CLE_SIGNATURE  — clé privée Ed25519 dédiée aux codes, signe chaque réponse
#                    d'échange. Voir docs/passation-codes.md pour la génération et
#                    la rotation ; le fichier source vit dans
#                    ~/.anagnosis/signature-codes-privee.pem.
