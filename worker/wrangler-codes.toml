name = "anagnosis-codes"
main = "codes.js"
compatibility_date = "2026-08-27"

[[d1_databases]]
binding = "DB"
database_name = "anagnosis-codes"
database_id = "e5ba6cae-8281-4980-891e-00f401defce0"

# Plafonne chaque IP appelante à dix requêtes par minute ; voir « Pourquoi une limite
# de débit » en tête de codes.js pour le raisonnement. `namespace_id` n'a besoin que
# d'être un entier positif unique dans ce compte Cloudflare, rien de plus : pas de
# ressource à créer à part comme pour un bucket D1 ou R2, la déclaration ci-dessous
# suffit. 1001 et 1002 (audio.js, wrangler.toml) sont deux valeurs arbitraires,
# choisies simplement distinctes ; ne pas réutiliser l'une pour un futur troisième
# compteur sans changer l'autre.
[[ratelimits]]
name = "LIMITEUR"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Deux secrets, posés avec `npx wrangler secret put <NOM> --config wrangler-codes.toml`
# et vivant ensuite côté Cloudflare, jamais dans ce dépôt :
#   CLE_PARTAGEE   — même valeur que celui d'audio.js (ANAGNOSIS_CLE_AUDIO_PARTAGEE
#                    dans ~/.anagnosis/cles.env). Distingue une requête de l'app d'un
#                    scan anonyme, rien de plus.
#   CLE_SIGNATURE  — clé privée Ed25519 dédiée aux codes, signe chaque réponse
#                    d'échange. Voir docs/passation-codes.md pour la génération et
#                    la rotation ; le fichier source vit dans
#                    ~/.anagnosis/signature-codes-privee.pem.
